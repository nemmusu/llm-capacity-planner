<svg xmlns="http://www.w3.org/2000/svg" width="828" height="638" viewBox="0 0 828 638" role="img" aria-label="$ llm-capacity-planner deepseek-ai/DeepSeek-V4-Pro-0813 --tokens 64k --gpu h200 --count 8 --details">
<rect x="0.5" y="0.5" width="827" height="637" rx="8" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 30V8.5a8 8 0 0 1 8-8h811a8 8 0 0 1 8 8V30Z" fill="#161b22"/>
<line x1="0.5" y1="30" x2="827.5" y2="30" stroke="#30363d"/>
<circle cx="18" cy="15" r="6" fill="#ff5f56"/>
<circle cx="38" cy="15" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="15" r="6" fill="#27c93f"/>
<text x="414" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">llm-capacity-planner</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9" xml:space="preserve" style="white-space:pre">
<text x="16.0" y="59"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3" font-weight="bold">llm-capacity-planner deepseek-ai/DeepSeek-V4-Pro-0813 --tokens 64k --gpu h200 --count 8 --details</tspan></text>
<text y="77"><tspan x="16.0" textLength="54.6" lengthAdjust="spacingAndGlyphs" font-weight="bold">Summary</tspan></text>
<text y="95"><tspan x="31.6" textLength="756.6" lengthAdjust="spacingAndGlyphs">Recommendation: none reliable — the user count is not precise enough to decide. The estimate, not</tspan></text>
<text y="113"><tspan x="62.8" textLength="733.2" lengthAdjust="spacingAndGlyphs">to plan on: 1 server with 8× NVIDIA H200 SXM 141GB serves 20 users guaranteed, 20 likely, with</tspan></text>
<text y="131"><tspan x="62.8" textLength="725.4" lengthAdjust="spacingAndGlyphs">requests of up to 64k tokens (≈ 49,000 words ≈ 98 pages; 32k on average). Caution: the engine</tspan></text>
<text y="149"><tspan x="62.8" textLength="577.2" lengthAdjust="spacingAndGlyphs">supports this setup only in part (see the notes under the per-card table).</tspan></text>
<text y="167"><tspan x="31.6" textLength="764.4" lengthAdjust="spacingAndGlyphs">Speed for each user: writing about 52 words per second (39 to 64; 69 tokens/s); with everyone busy</tspan></text>
<text y="185"><tspan x="62.8" textLength="725.4" lengthAdjust="spacingAndGlyphs">the first words appear after about 1.0 s, and a full 64k-token request alone is read in about</tspan></text>
<text y="203"><tspan x="62.8" textLength="226.2" lengthAdjust="spacingAndGlyphs">2.0 s (1 token ≈ 0.75 words).</tspan></text>
<text y="221"><tspan x="31.6" textLength="733.2" lengthAdjust="spacingAndGlyphs">Confidence: memory high (±7.1%); writing speed medium (±24%); reading time medium (±37%); user</tspan></text>
<text y="239"><tspan x="62.8" textLength="709.8" lengthAdjust="spacingAndGlyphs">count low, not precise enough to decide (more than ±50%). Do not plan on these user counts:</tspan></text>
<text y="257"><tspan x="62.8" textLength="366.6" lengthAdjust="spacingAndGlyphs">the user count is not precise enough to decide.</tspan></text>
<text y="293"><tspan x="16.0" textLength="124.8" lengthAdjust="spacingAndGlyphs" font-weight="bold">Technical detail</tspan></text>
<text y="311"><tspan x="31.6" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">…</tspan></text>
<text y="329"><tspan x="16.0" textLength="546.0" lengthAdjust="spacingAndGlyphs">Details — 8× H200 SXM 141GB (1 model on 8), one request of 64k tokens:</tspan></text>
<text y="347"><tspan x="31.6" textLength="109.2" lengthAdjust="spacingAndGlyphs">memory per GPU</tspan><tspan x="234.4" textLength="390.0" lengthAdjust="spacingAndGlyphs">116.1 GiB (107.8 to 124.4 GiB, ±7.1%) of 139.7 GiB</tspan></text>
<text y="365"><tspan x="234.4" textLength="358.8" lengthAdjust="spacingAndGlyphs">estimated (±7.1%, the fixed costs are a range)</tspan></text>
<text y="383"><tspan x="47.2" textLength="54.6" lengthAdjust="spacingAndGlyphs">weights</tspan><tspan x="234.4" textLength="62.4" lengthAdjust="spacingAndGlyphs">99.2 GiB</tspan></text>
<text y="401"><tspan x="234.4" textLength="530.4" lengthAdjust="spacingAndGlyphs">exact (sum of the loaded tensors; the engine measured up to +13% for</tspan></text>
<text y="419"><tspan x="234.4" textLength="312.0" lengthAdjust="spacingAndGlyphs">this format: counted in the fixed costs)</tspan></text>
<text y="437"><tspan x="47.2" textLength="241.8" lengthAdjust="spacingAndGlyphs">KV cache of one request 3.8 GiB</tspan><tspan x="312.4" textLength="460.2" lengthAdjust="spacingAndGlyphs">exact (blocks and layer groups of the vLLM 0.31.0 KV cache)</tspan></text>
<text y="455"><tspan x="47.2" textLength="85.8" lengthAdjust="spacingAndGlyphs">fixed costs</tspan><tspan x="234.4" textLength="249.6" lengthAdjust="spacingAndGlyphs">13.1 GiB (4.8 to 21.4 GiB, ±63%)</tspan></text>
<text y="473"><tspan x="234.4" textLength="553.8" lengthAdjust="spacingAndGlyphs">estimated (±63%, CUDA context, activations, CUDA graphs and workspaces:</tspan></text>
<text y="491"><tspan x="234.4" textLength="132.6" lengthAdjust="spacingAndGlyphs">a measured range)</tspan></text>
<text y="509"><tspan x="31.6" textLength="140.4" lengthAdjust="spacingAndGlyphs">held by the engine</tspan><tspan x="234.4" textLength="390.0" lengthAdjust="spacingAndGlyphs">126.6 GiB (126.1 to 127.0 GiB, ±0.3%) of 139.7 GiB</tspan></text>
<text y="527"><tspan x="234.4" textLength="553.8" lengthAdjust="spacingAndGlyphs">the engine's share (--gpu-memory-utilization × the CUDA memory), all of</tspan></text>
<text y="545"><tspan x="234.4" textLength="514.8" lengthAdjust="spacingAndGlyphs">it reserved, plus what the process keeps outside it (CUDA context,</tspan></text>
<text y="563"><tspan x="234.4" textLength="522.6" lengthAdjust="spacingAndGlyphs">communication buffers); what the share leaves after the weights and</tspan></text>
<text y="581"><tspan x="234.4" textLength="179.4" lengthAdjust="spacingAndGlyphs">fixed costs is KV cache</tspan></text>
<text y="599"><tspan x="31.6" textLength="46.8" lengthAdjust="spacingAndGlyphs">margin</tspan><tspan x="234.4" textLength="249.6" lengthAdjust="spacingAndGlyphs">10.5 GiB (2.6 to 18.4 GiB, ±75%)</tspan></text>
<text x="16.0" y="617" fill="#8b949e">…</text>
</g>
</svg>
