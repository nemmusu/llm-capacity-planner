<svg xmlns="http://www.w3.org/2000/svg" width="828" height="638" viewBox="0 0 828 638" role="img" aria-label="$ llm-capacity-planner zai-org/GLM-5.3 --tokens 128k --users 200">
<rect x="0.5" y="0.5" width="827" height="637" rx="8" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 30V8.5a8 8 0 0 1 8-8h811a8 8 0 0 1 8 8V30Z" fill="#161b22"/>
<line x1="0.5" y1="30" x2="827.5" y2="30" stroke="#30363d"/>
<circle cx="18" cy="15" r="6" fill="#ff5f56"/>
<circle cx="38" cy="15" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="15" r="6" fill="#27c93f"/>
<text x="414" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">llm-capacity-planner</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9" xml:space="preserve" style="white-space:pre">
<text x="16.0" y="59"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3" font-weight="bold">llm-capacity-planner zai-org/GLM-5.3 --tokens 128k --users 200</tspan></text>
<text y="77"><tspan x="16.0" textLength="54.6" lengthAdjust="spacingAndGlyphs" font-weight="bold">Summary</tspan></text>
<text y="95"><tspan x="31.6" textLength="764.4" lengthAdjust="spacingAndGlyphs">Recommendation: 2 servers with 8× NVIDIA B300 SXM each serve 200 users with requests of up to 128k</tspan></text>
<text y="113"><tspan x="62.8" textLength="725.4" lengthAdjust="spacingAndGlyphs">tokens (≈ 98,000 words ≈ 200 pages; 64k on average): ≈ 100 users per server. Each server runs</tspan></text>
<text y="131"><tspan x="62.8" textLength="694.2" lengthAdjust="spacingAndGlyphs">2 copies of the model, and a load balancer (a router in front of the servers) spreads the</tspan></text>
<text y="149"><tspan x="62.8" textLength="733.2" lengthAdjust="spacingAndGlyphs">users across them. Caution: each server runs at 100% of its guaranteed capacity, so waits grow</tspan></text>
<text y="167"><tspan x="62.8" textLength="436.8" lengthAdjust="spacingAndGlyphs">fast with more traffic: one more server leaves headroom.</tspan></text>
<text y="185"><tspan x="31.6" textLength="756.6" lengthAdjust="spacingAndGlyphs">Alternative: 3 servers with 8× NVIDIA B200 SXM each (≈ 70 users per server). Caution: each server</tspan></text>
<text y="203"><tspan x="62.8" textLength="725.4" lengthAdjust="spacingAndGlyphs">runs at 95% of its guaranteed capacity, so waits grow fast with more traffic: one more server</tspan></text>
<text y="221"><tspan x="62.8" textLength="124.8" lengthAdjust="spacingAndGlyphs">leaves headroom.</tspan></text>
<text y="239"><tspan x="31.6" textLength="725.4" lengthAdjust="spacingAndGlyphs">Not enough: RTX PRO 6000 Server, L4, L40S, A100 and H100, even with 8 GPUs in one server; RTX</tspan></text>
<text y="257"><tspan x="62.8" textLength="694.2" lengthAdjust="spacingAndGlyphs">A6000, RTX 6000 Ada, RTX PRO 6000 WS, RTX PRO 6000 Max-Q and consumer cards, even with 4;</tspan></text>
<text y="275"><tspan x="62.8" textLength="148.2" lengthAdjust="spacingAndGlyphs">GH200, even with 2.</tspan></text>
<text y="293"><tspan x="31.6" textLength="764.4" lengthAdjust="spacingAndGlyphs">Speed for each user: writing about 30 words per second (15 to 44; 39 tokens/s); with everyone busy</tspan></text>
<text y="311"><tspan x="62.8" textLength="733.2" lengthAdjust="spacingAndGlyphs">the first words appear after about 1.6 s, and a full 128k-token request alone is read in about</tspan></text>
<text y="329"><tspan x="62.8" textLength="226.2" lengthAdjust="spacingAndGlyphs">3.0 s (1 token ≈ 0.75 words).</tspan></text>
<text y="347"><tspan x="31.6" textLength="764.4" lengthAdjust="spacingAndGlyphs">Confidence: memory high (±2.6%); writing speed medium (±48%); reading time low, not precise enough</tspan></text>
<text y="365"><tspan x="62.8" textLength="663.0" lengthAdjust="spacingAndGlyphs">to decide (more than ±50%); user count medium (±48%). Plan on the guaranteed figures.</tspan></text>
<text y="401"><tspan x="16.0" textLength="124.8" lengthAdjust="spacingAndGlyphs" font-weight="bold">Technical detail</tspan></text>
<text y="419"><tspan x="31.6" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">…</tspan></text>
<text y="437"><tspan x="16.0" textLength="780.0" lengthAdjust="spacingAndGlyphs">Per card: the layout with the fewest GPUs in total that serves 200 users (10% active ≈ 20 concurrent</tspan></text>
<text y="455"><tspan x="16.0" textLength="452.4" lengthAdjust="spacingAndGlyphs">requests), and the servers it takes; users are per server.</tspan></text>
<text y="473"><tspan x="31.6" textLength="31.2" lengthAdjust="spacingAndGlyphs">Card</tspan><tspan x="195.4" textLength="54.6" lengthAdjust="spacingAndGlyphs">Verdict</tspan><tspan x="304.6" textLength="31.2" lengthAdjust="spacingAndGlyphs">GPUs</tspan><tspan x="374.8" textLength="54.6" lengthAdjust="spacingAndGlyphs">Servers</tspan><tspan x="445.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">Memory per GPU</tspan><tspan x="686.8" textLength="39.0" lengthAdjust="spacingAndGlyphs">Users</tspan><tspan x="764.8" textLength="39.0" lengthAdjust="spacingAndGlyphs">Users</tspan></text>
<text y="491"><tspan x="382.6" textLength="46.8" lengthAdjust="spacingAndGlyphs">needed</tspan><tspan x="445.0" textLength="39.0" lengthAdjust="spacingAndGlyphs">(GiB)</tspan><tspan x="632.2" textLength="93.6" lengthAdjust="spacingAndGlyphs">(guaranteed)</tspan><tspan x="741.4" textLength="62.4" lengthAdjust="spacingAndGlyphs">(likely)</tspan></text>
<text y="509"><tspan x="31.6" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">…</tspan></text>
<text y="527"><tspan x="31.6" textLength="85.8" lengthAdjust="spacingAndGlyphs">GH200 144GB</tspan><tspan x="195.4" textLength="93.6" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">does not fit</tspan><tspan x="304.6" textLength="7.8" lengthAdjust="spacingAndGlyphs">-</tspan><tspan x="445.0" textLength="171.6" lengthAdjust="spacingAndGlyphs">with 2: 367.3 of 142.5</tspan></text>
<text y="545"><tspan x="31.6" textLength="109.2" lengthAdjust="spacingAndGlyphs">H200 SXM 141GB</tspan><tspan x="195.4" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#3fb950">fits</tspan><tspan x="304.6" textLength="54.6" lengthAdjust="spacingAndGlyphs">8 (1×8)</tspan><tspan x="421.6" textLength="7.8" lengthAdjust="spacingAndGlyphs">5</tspan><tspan x="445.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">102.8 of 139.7</tspan><tspan x="710.2" textLength="15.6" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="788.2" textLength="15.6" lengthAdjust="spacingAndGlyphs">70</tspan></text>
<text y="563"><tspan x="31.6" textLength="109.2" lengthAdjust="spacingAndGlyphs">H200 NVL 141GB</tspan><tspan x="195.4" textLength="62.4" lengthAdjust="spacingAndGlyphs" fill="#3fb950">fits (1)</tspan><tspan x="304.6" textLength="54.6" lengthAdjust="spacingAndGlyphs">8 (1×8)</tspan><tspan x="413.8" textLength="15.6" lengthAdjust="spacingAndGlyphs">20</tspan><tspan x="445.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">102.8 of 139.4</tspan><tspan x="710.2" textLength="15.6" lengthAdjust="spacingAndGlyphs">10</tspan><tspan x="788.2" textLength="15.6" lengthAdjust="spacingAndGlyphs">20</tspan></text>
<text y="581"><tspan x="31.6" textLength="62.4" lengthAdjust="spacingAndGlyphs">B200 SXM</tspan><tspan x="195.4" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#3fb950">fits</tspan><tspan x="304.6" textLength="54.6" lengthAdjust="spacingAndGlyphs">8 (1×8)</tspan><tspan x="421.6" textLength="7.8" lengthAdjust="spacingAndGlyphs">3</tspan><tspan x="445.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">108.1 of 178.3</tspan><tspan x="710.2" textLength="15.6" lengthAdjust="spacingAndGlyphs">70</tspan><tspan x="780.4" textLength="23.4" lengthAdjust="spacingAndGlyphs">130</tspan></text>
<text y="599"><tspan x="31.6" textLength="62.4" lengthAdjust="spacingAndGlyphs">B300 SXM</tspan><tspan x="195.4" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#3fb950">fits</tspan><tspan x="304.6" textLength="54.6" lengthAdjust="spacingAndGlyphs">8 (2×4)</tspan><tspan x="421.6" textLength="7.8" lengthAdjust="spacingAndGlyphs">2</tspan><tspan x="445.0" textLength="109.2" lengthAdjust="spacingAndGlyphs">196.3 of 267.7</tspan><tspan x="702.4" textLength="23.4" lengthAdjust="spacingAndGlyphs">100</tspan><tspan x="780.4" textLength="23.4" lengthAdjust="spacingAndGlyphs">180</tspan></text>
<text x="16.0" y="617" fill="#8b949e">…</text>
</g>
</svg>
