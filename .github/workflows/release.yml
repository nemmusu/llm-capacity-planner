# A release, built when a version tag is pushed (git tag v0.1.0 && git push --tags; see CONTRIBUTING.md).
# Each system validates the sources, builds its single executable (with the built-in models inside), checks that the
# built files match the sources and smoke-tests the executable. The release job then attaches every executable, the
# portable bundle (.mjs) with its models pack and SHA256SUMS.txt to a GitHub Release, with the notes of that version
# from CHANGELOG.md; the Linux and macOS executables go in a .tar.gz, which keeps them executable. The executables are
# not signed: see the README for macOS Gatekeeper.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            # The bundle and the models pack are the same on every system: one copy is attached.
            portable: true
          - os: macos-latest
          # macOS on Intel. If GitHub retires this runner label, change it or remove the entry.
          - os: macos-15-intel
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run dist
      - name: The built files match the sources
        run: npx vitest run test/dist
      - name: Smoke test of the single executable (offline, built-in model)
        shell: bash
        env:
          HF_ENDPOINT: http://127.0.0.1:9
        run: |
          name=$(node -p "require('./package.json').name")
          exe=$(ls dist/"$name"-*-* | head -n 1)
          "$exe" --version
          "$exe" Qwen/Qwen3.5-9B --tokens 32k --offline --no-color
      - name: Keep what this system attaches
        shell: bash
        run: |
          mkdir -p release
          name=$(node -p "require('./package.json').name")
          cp dist/"$name"-*-* release/
          if [ "${{ matrix.portable }}" = "true" ]; then cp dist/"$name".mjs dist/"$name"-models.pack release/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files and their checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          # Linux and macOS executables go in a .tar.gz, which keeps their execute permission (a plain download does not).
          for f in *-linux-* *-macos-*; do
            [ -f "$f" ] || continue
            chmod +x "$f" && tar -czf "$f.tar.gz" "$f" && rm "$f"
          done
          # Written outside the folder first, so the list never includes itself.
          sha256sum * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt . && cat SHA256SUMS.txt
      - name: Notes of this version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
